<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitHub Username Renamer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
      Three views, one shown at a time. A Chrome popup is capped at 600px tall,
      and the list, the color wheel and the backup boxes come to more than that
      together — so the two settings panels replace the list rather than unfold
      beneath it, and nothing ends up below the fold at any list size.
    -->
    <section class="view" id="view-main">
      <header class="header">
        <div class="brand">
          <h1>Username Renamer</h1>
          <p class="subtitle" id="summary">No names yet</p>
        </div>
        <label class="switch" title="Turn all replacements on or off">
          <input type="checkbox" id="enabled" />
          <span class="track"><span class="thumb"></span></span>
        </label>
      </header>

      <form class="add-form" id="add-form" autocomplete="off">
        <div class="field">
          <label for="username">GitHub username</label>
          <input type="text" id="username" placeholder="GitHub Username" spellcheck="false" required />
        </div>
        <div class="field">
          <label for="replacement">Show instead</label>
          <input type="text" id="replacement" placeholder="Real Name" required />
        </div>
        <button type="submit" class="primary">Add</button>
      </form>

      <div class="list-header" id="list-header" hidden>
        <input type="search" id="filter" placeholder="Filter…" spellcheck="false" />
      </div>

      <ul class="list" id="list"></ul>

      <p class="empty" id="empty">
        Add a username above, or right-click any username on GitHub and choose
        <strong>Replace this GitHub username…</strong>
      </p>

      <nav class="nav">
        <button type="button" class="nav-row" data-open="color">
          <span class="color-swatch" id="color-swatch" aria-hidden="true"></span>
          <span class="nav-label">Highlight color</span>
          <span class="nav-value" id="color-value"></span>
          <span class="chevron" aria-hidden="true">›</span>
        </button>
        <button type="button" class="nav-row" data-open="backup">
          <span class="nav-label">Backup</span>
          <span class="chevron" aria-hidden="true">›</span>
        </button>
      </nav>
    </section>

    <section class="view" id="view-color" hidden>
      <header class="panel-head">
        <button type="button" class="back" aria-label="Back to the name list">‹</button>
        <h1>Highlight color</h1>
      </header>

      <div class="color-body">
        <div class="wheel-stage">
          <canvas
            id="wheel"
            class="wheel"
            tabindex="0"
            role="application"
            aria-label="Color wheel. Left and right arrows change hue, up and down change saturation."
          ></canvas>
          <span class="wheel-marker" id="wheel-marker" aria-hidden="true"></span>
        </div>

        <div class="color-side">
          <input type="text" id="hex" class="hex" spellcheck="false" maxlength="7" aria-label="Hex color" />

          <div class="chip" id="chip-dark" data-theme="dark">
            <span class="chip-sample"></span>
            <span class="chip-meta"></span>
          </div>
          <div class="chip" id="chip-light" data-theme="light">
            <span class="chip-sample"></span>
            <span class="chip-meta"></span>
          </div>

          <p class="color-note" id="color-note"></p>
        </div>
      </div>

      <button type="button" class="color-reset" id="color-reset">Reset to the default green</button>
    </section>

    <section class="view" id="view-backup" hidden>
      <header class="panel-head">
        <button type="button" class="back" aria-label="Back to the name list">‹</button>
        <h1>Backup</h1>
      </header>

      <div class="backup-body">
        <div class="backup-block">
          <div class="backup-head">
            <label for="export-json">Your names, as JSON</label>
            <button type="button" id="copy">Copy</button>
          </div>
          <textarea id="export-json" class="json" readonly spellcheck="false"></textarea>
        </div>

        <div class="backup-block">
          <div class="backup-head">
            <label for="import-json">Paste JSON to merge in</label>
            <button type="button" id="import">Import</button>
          </div>
          <textarea
            id="import-json"
            class="json"
            spellcheck="false"
            placeholder='{"octocat": "The Octocat"}'
          ></textarea>
        </div>
      </div>
    </section>

    <!--
      Outside the views, so a message raised from a panel — an import warning,
      a failed copy — is shown wherever it was raised from, and so the live
      region stays put in the DOM across a view change.
    -->
    <p class="status" id="status" role="status" aria-live="polite" hidden></p>

    <script src="common.js"></script>
    <script src="store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
